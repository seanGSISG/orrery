[project]
name = "orrery-music"
version = "0.1.0"
description = "Orrery music pipeline: ComfyUI backing takes, an authored MIDI hook and clockwork layer, checks and a review page."
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.1",
    "mido>=1.3.3",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
orrery-music = "orrery_music.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
