[project]
name = "orrery-harness"
version = "0.1.0"
description = "Launch and drive a debug build of Orrery: an MCP server and a CLI over the game harness."
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0", "pydantic==2.14.4"]

[project.scripts]
orrery-harness = "orrery_harness.cli:main"
orrery-harness-mcp = "orrery_harness.mcp_server:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU and gamescope; run it locally with `-m gpu`"]
addopts = "-m 'not gpu'"

[tool.ruff]
src = ["src"]
