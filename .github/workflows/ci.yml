name: CI

on:
  pull_request:
    branches: [main, "plan-*"]
  push:
    branches: [main, "plan-*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@v10.3.3
      - run: just lint

  test:
    name: Import and GUT (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just test

  export:
    name: Export Linux and Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          templates: "true"
      - run: just export
      - name: Boot the Linux export
        timeout-minutes: 2
        run: build/linux/orrery.x86_64 --headless -- --smoke | grep '^ORRERY boot ok'
      # Artifact zips drop the executable bit; a tarball keeps it.
      - run: tar -czf build/orrery-linux.tar.gz -C build/linux .
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-linux
          path: build/orrery-linux.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-windows
          path: build/windows/
          if-no-files-found: error

  # Boots the Windows export that the export job uploads.
  windows-boot:
    name: Boot the Windows export
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: orrery-windows
          path: build/windows/
      - name: Boot the Windows export
        timeout-minutes: 2
        run: build/windows/orrery.exe --headless -- --smoke | grep '^ORRERY boot ok'
