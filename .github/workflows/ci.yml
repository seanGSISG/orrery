name: CI

on:
  pull_request:
    branches: [main, "plan-*"]
  push:
    branches: [main, "plan-*"]
  workflow_dispatch:

# A new push to a pull request cancels its older run: the new run checks the whole pull request.
# A push to a branch runs in a group of its own, never cancelled or queued behind another: its
# run checks only that push's changes, so every such run must finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every job imports the project, with its Git LFS files (textures, skies, lightmaps, music).
# The setup action pulls them through a cache. Do not set `lfs: true` on a checkout: it
# downloads every LFS file again on every run, past the cache, and that uses up the LFS quota.
jobs:
  # Lists the changed files and picks the jobs they need (.github/pick-jobs.sh holds the rules).
  # A pull request compares with its base, a push with the commit before it. A new branch, a
  # manual run or a failed diff runs every job. A docs-only change runs no other job.
  changes:
    name: Pick the jobs
    runs-on: ubuntu-latest
    outputs:
      levels: ${{ steps.pick.outputs.levels }}
      lint-game: ${{ steps.pick.outputs.lint-game }}
      lint-scripts: ${{ steps.pick.outputs.lint-scripts }}
      test: ${{ steps.pick.outputs.test }}
      harness: ${{ steps.pick.outputs.harness }}
      export: ${{ steps.pick.outputs.export }}
      music: ${{ steps.pick.outputs.music }}
      art: ${{ steps.pick.outputs.art }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The pull request checkout is a merge commit; its first parent is the base.
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          if [[ -z $base || $base =~ ^0+$ ]] || ! files=$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD); then
            files=everything
          fi
          picked=$(.github/pick-jobs.sh <<<"$files")
          echo "$picked" >> "$GITHUB_OUTPUT"
          {
            echo '### Changed files'
            echo '```'
            echo "$files"
            echo '```'
            if [[ $picked != *=true* ]]; then
              echo 'Docs-only change: no job runs beyond this one.'
            else
              echo "Outputs set to true (windows-boot follows export; the tools job runs music and art): $(grep '=true' <<<"$picked" | cut -d= -f1 | paste -sd ' ')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # GDScript: gdlint and a compile check, which imports the game.
  lint-game:
    name: Lint GDScript
    needs: [changes, levels]
    if: needs.changes.outputs.lint-game == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v7
        with:
          name: marble
          path: game/core/marble/built/
      - run: just lint-game

  # Python and shell scripts. It needs no Godot and no LFS files, so a tool change lints fast.
  lint-scripts:
    name: Lint scripts
    needs: changes
    if: needs.changes.outputs.lint-scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - run: just lint-scripts

  # Builds the marble's core with Blender, and for the tests and the export every level script
  # too, and checks the import. Every other job that runs the game gets the core, because the
  # marble scene needs it. The levels output is `all`, `core` or `false` (.github/pick-jobs.sh).
  levels:
    name: Build levels
    needs: changes
    if: needs.changes.outputs.levels != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Read the Blender and glTF-Validator pins
        id: pins
        run: |
          source tools/setup/pins.env
          echo "key=blender-$BLENDER_VERSION-gltf-validator-$GLTF_VALIDATOR_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.local/opt
          key: ${{ steps.pins.outputs.key }}
      - run: tools/blender/install-ci.sh
      - if: needs.changes.outputs.levels == 'all'
        run: just build-levels
      - if: needs.changes.outputs.levels != 'all'
        run: just build-marble
      - uses: actions/upload-artifact@v7
        with:
          name: marble
          path: game/core/marble/built/
          if-no-files-found: error
      - if: needs.changes.outputs.levels == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: levels
          path: game/levels/built/
          if-no-files-found: error

  test:
    name: Import, GUT and level tests (${{ matrix.os }})
    needs: [changes, levels]
    if: needs.changes.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v7
        with:
          name: marble
          path: game/core/marble/built/
      - uses: actions/download-artifact@v7
        with:
          name: levels
          path: game/levels/built/
      - run: just test
      - run: just test-levels

  # The harness contract tests against a headless debug build; the GPU screenshot test runs locally.
  harness:
    name: Harness contract tests
    needs: [changes, levels]
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v7
        with:
          name: marble
          path: game/core/marble/built/
      - run: just test-harness

  export:
    name: Export Linux and Windows
    needs: [changes, levels]
    if: needs.changes.outputs.export == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          templates: "true"
      - uses: actions/download-artifact@v7
        with:
          name: marble
          path: game/core/marble/built/
      - uses: actions/download-artifact@v7
        with:
          name: levels
          path: game/levels/built/
      - run: just export
      - name: Boot the Linux export
        timeout-minutes: 2
        run: build/linux/orrery.x86_64 --headless --audio-driver Dummy -- --smoke | grep '^ORRERY boot ok'
      - name: Play every level in the Linux export
        timeout-minutes: 3
        run: .github/check-export.sh build/linux/orrery.x86_64
      # Artifact zips drop the executable bit; a tarball keeps it.
      - run: tar -czf build/orrery-linux.tar.gz -C build/linux .
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-linux
          path: build/orrery-linux.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-windows
          path: build/windows/
          if-no-files-found: error

  # Boots the Windows export that the export job uploads and plays every level in it. It is
  # skipped when the export is. The check needs only the names of the level scripts and the
  # bakes, so the checkout is sparse and has no LFS files.
  windows-boot:
    name: Boot the Windows export
    needs: export
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            levels
            game/levels/lightmaps
      - uses: actions/download-artifact@v7
        with:
          name: orrery-windows
          path: build/windows/
      - name: Boot the Windows export
        timeout-minutes: 2
        run: build/windows/orrery.exe --headless --audio-driver Dummy -- --smoke | grep '^ORRERY boot ok'
      - name: Play every level in the Windows export
        timeout-minutes: 3
        run: .github/check-export.sh build/windows/orrery.exe

  # The music pipeline's and the asset tools' pytest suites. They need no Godot and no LFS files;
  # the music tests measure loudness with ffmpeg.
  tools:
    name: Tool tests
    needs: changes
    if: needs.changes.outputs.music == 'true' || needs.changes.outputs.art == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - if: needs.changes.outputs.music == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          just test-music
      - if: needs.changes.outputs.art == 'true'
        run: just test-art
