name: CI

on:
  pull_request:
    branches: [main, "plan-*"]
  push:
    branches: [main, "plan-*"]
    tags: ["v*"]
  workflow_dispatch:

# A new push to a pull request cancels its older run: the new run checks the whole pull request.
# A push to a branch runs in a group of its own, never cancelled or queued behind another: its
# run checks only that push's changes, so every such run must finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Every job imports the project, with its Git LFS files (textures, skies, lightmaps, music).
# The setup action pulls them through a cache. Do not set `lfs: true` on a checkout: it
# downloads every LFS file again on every run, past the cache, and that uses up the LFS quota.
# The setup action also downloads the built core and levels (input `built`) and restores the
# Godot import (game/.godot) from a cache, with a key that hashes the imported files.
# The setup action also writes game/override.cfg to turn off GPU texture compression (godotengine/godot#114121); to revert, remove its last step.
jobs:
  # Lists the changed files and picks the jobs they need (.github/pick-jobs.sh holds the rules).
  # A pull request compares with its base, a push with the commit before it. A new branch or tag, a
  # manual run or a failed diff runs every job. A docs-only change runs no other job.
  changes:
    name: Pick the jobs
    runs-on: ubuntu-latest
    # Each timeout is 2.5 times the longest recent successful run of the job, rounded up to 5 minutes (at least 5). A hung job then fails fast.
    timeout-minutes: 5
    outputs:
      levels: ${{ steps.pick.outputs.levels }}
      lint-game: ${{ steps.pick.outputs.lint-game }}
      lint-scripts: ${{ steps.pick.outputs.lint-scripts }}
      test: ${{ steps.pick.outputs.test }}
      harness: ${{ steps.pick.outputs.harness }}
      export: ${{ steps.pick.outputs.export }}
      music: ${{ steps.pick.outputs.music }}
      art: ${{ steps.pick.outputs.art }}
      perf: ${{ steps.pick.outputs.perf }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The pull request checkout is a merge commit; its first parent is the base.
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          if [[ -z $base || $base =~ ^0+$ ]] || ! files=$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD); then
            files=everything
          fi
          picked=$(.github/pick-jobs.sh <<<"$files")
          echo "$picked" >> "$GITHUB_OUTPUT"
          {
            echo '### Changed files'
            echo '```'
            echo "$files"
            echo '```'
            if [[ $picked != *=true* ]]; then
              echo 'Docs-only change: no job runs beyond this one.'
            else
              echo "Outputs set to true (windows-boot follows export; the tools job runs music, art and perf): $(grep '=true' <<<"$picked" | cut -d= -f1 | paste -sd ' ')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # GDScript: gdlint and a compile check, which imports the game.
  lint-game:
    name: Lint GDScript
    needs: [changes, levels]
    if: needs.changes.outputs.lint-game == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          built: core
      - uses: astral-sh/setup-uv@v10.3.3
      - run: just lint-game

  # Python and shell scripts. It needs no Godot and no LFS files, so a tool change lints fast.
  lint-scripts:
    name: Lint scripts
    needs: changes
    if: needs.changes.outputs.lint-scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - run: just lint-scripts

  # Builds the marble's core with Blender, and for the tests and the export every level script
  # too, and checks the import. Every other job that runs the game gets the core, because the
  # marble scene needs it. The levels output is `all`, `core` or `false` (.github/pick-jobs.sh).
  # The core and the level .glb files come from a cache when no input of their Blender build
  # changed: each key hashes every input (docs/plan.md 5.3), and the key has no restore prefix,
  # so a changed input always builds again. The levels are imported and checked on every run.
  levels:
    name: Build levels
    needs: changes
    if: needs.changes.outputs.levels != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Read the Blender and glTF-Validator pins
        id: pins
        run: |
          source tools/setup/pins.env
          echo "key=blender-$BLENDER_VERSION-gltf-validator-$GLTF_VALIDATOR_VERSION" >> "$GITHUB_OUTPUT"
      # The checkout has the Git LFS pointer files here, which hold the SHA-256 of each file.
      - name: Restore the built marble core
        id: marble
        uses: actions/cache@v6
        with:
          path: game/core/marble/built/
          key: marble-${{ steps.pins.outputs.key }}-${{ hashFiles('tools/blender/marble_core.py', 'assets/textures/metal/Metal048A_2K-JPG_Color.jpg', 'game/core/marble/core_import.gd', 'justfile') }}
      - name: Restore the built levels
        id: built
        if: needs.changes.outputs.levels == 'all'
        uses: actions/cache@v6
        with:
          path: game/levels/built/*.glb
          key: levels-${{ steps.pins.outputs.key }}-${{ hashFiles('levels/**', 'kit/**', 'tools/blender/**', 'assets/props/**', 'assets/decals/**', 'game/skies/*.tres') }}
      - name: Pick the builds
        id: need
        env:
          LEVELS: ${{ needs.changes.outputs.levels }}
          MARBLE_HIT: ${{ steps.marble.outputs.cache-hit }}
          LEVELS_HIT: ${{ steps.built.outputs.cache-hit }}
        run: |
          blender=false
          if [[ $MARBLE_HIT != true || ($LEVELS == all && $LEVELS_HIT != true) ]]; then blender=true; fi
          echo "blender=$blender" >> "$GITHUB_OUTPUT"
          echo "setup=$([[ $blender == true || $LEVELS == all ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.setup == 'true'
        uses: ./.github/actions/setup
      - if: needs.changes.outputs.levels == 'all'
        uses: astral-sh/setup-uv@v10.3.3
      - if: steps.need.outputs.blender == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/opt
          key: ${{ steps.pins.outputs.key }}
      - if: steps.need.outputs.blender == 'true'
        run: tools/blender/install-ci.sh
      - if: needs.changes.outputs.levels == 'all'
        env:
          MARBLE_HIT: ${{ steps.marble.outputs.cache-hit }}
          LEVELS_HIT: ${{ steps.built.outputs.cache-hit }}
        run: |
          # A restored core keeps its old modification time, older than the files of the LFS pull.
          # Touch it, or `just fresh-marble` sees it as older than its texture and builds it again.
          if [[ $MARBLE_HIT == true ]]; then touch game/core/marble/built/*; fi
          if [[ $LEVELS_HIT == true ]]; then just build-levels --reuse; else just build-levels; fi
      - if: needs.changes.outputs.levels != 'all' && steps.need.outputs.blender == 'true'
        run: just build-marble
      - uses: actions/upload-artifact@v7
        with:
          name: marble
          path: game/core/marble/built/
          if-no-files-found: error
      - if: needs.changes.outputs.levels == 'all'
        uses: actions/upload-artifact@v7
        with:
          name: levels
          path: game/levels/built/
          if-no-files-found: error

  test:
    name: Import, GUT and level tests (${{ matrix.os }})
    needs: [changes, levels]
    if: needs.changes.outputs.test == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          built: all
      - run: just test
      - run: just test-levels

  # The harness contract tests against a headless debug build; the GPU screenshot test runs locally.
  harness:
    name: Harness contract tests
    needs: [changes, levels]
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          built: core
      - uses: astral-sh/setup-uv@v10.3.3
      - run: just test-harness

  export:
    name: Export Linux and Windows
    needs: [changes, levels]
    if: needs.changes.outputs.export == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          templates: "true"
          built: all
      - run: just export
      - name: Boot the Linux export
        timeout-minutes: 2
        run: build/linux/orrery.x86_64 --headless --audio-driver Dummy -- --smoke | grep '^ORRERY boot ok'
      - name: Play every level in the Linux export
        timeout-minutes: 3
        run: .github/check-export.sh build/linux/orrery.x86_64
      # Artifact zips drop the executable bit; a tarball keeps it.
      - run: tar -czf build/orrery-linux.tar.gz -C build/linux .
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-linux
          path: build/orrery-linux.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: orrery-windows
          path: build/windows/
          if-no-files-found: error

  # Boots the Windows export that the export job uploads and plays every level in it. It is
  # skipped when the export is. The check needs only the names of the level scripts and the
  # bakes, so the checkout is sparse and has no LFS files.
  windows-boot:
    name: Boot the Windows export
    needs: export
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            levels
            game/levels/lightmaps
      - uses: actions/download-artifact@v7
        with:
          name: orrery-windows
          path: build/windows/
      - name: Boot the Windows export
        timeout-minutes: 2
        run: build/windows/orrery.exe --headless --audio-driver Dummy -- --smoke | grep '^ORRERY boot ok'
      - name: Play every level in the Windows export
        timeout-minutes: 3
        run: .github/check-export.sh build/windows/orrery.exe

  # The pytest suites of the music pipeline, the asset tools and the perf tool. They need no Godot
  # and no LFS files; the music tests measure loudness with ffmpeg.
  tools:
    name: Tool tests
    needs: changes
    if: needs.changes.outputs.music == 'true' || needs.changes.outputs.art == 'true' || needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - if: needs.changes.outputs.music == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          just test-music
      - if: needs.changes.outputs.art == 'true'
        run: just test-art
      - if: needs.changes.outputs.perf == 'true'
        run: just test-perf

  # A version tag (`v*`) publishes the exports that the other jobs checked as a GitHub release; it
  # builds nothing again. A tag with a hyphen (v0.1.0-rc.1) makes a prerelease. docs/plan.md 5.3
  # tells how to cut a release.
  release:
    name: Publish the release
    needs: [lint-game, lint-scripts, test, harness, windows-boot, tools]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: orrery-linux
          path: linux/
      - uses: actions/download-artifact@v7
        with:
          name: orrery-windows
          path: windows/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv linux/orrery-linux.tar.gz "orrery-$TAG-linux-x86_64.tar.gz"
          (cd windows && zip -r "../orrery-$TAG-windows-x86_64.zip" .)
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}" \
            "orrery-$TAG-linux-x86_64.tar.gz" "orrery-$TAG-windows-x86_64.zip"
