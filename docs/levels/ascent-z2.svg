<text class="m-t m-s m-end" x="-24" y="6">50</text><text class="m-t m-s m-end" x="-24" y="-94">60</text><text class="m-t m-s m-end" x="-24" y="-194">70</text><text class="m-t m-s m-end" x="-24" y="-294">80</text><text class="m-t m-s m-end" x="-24" y="-394">90</text><text class="m-t m-s m-end" x="-24" y="-494">100</text>
