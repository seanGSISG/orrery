<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1210" role="img" aria-labelledby="ascentz2title">
<title id="ascentz2title">Ascent 2 The Broken Tower: side elevation with top-down inset</title>
<style>
