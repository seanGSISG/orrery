<text class="m-t m-s" x="384" y="14">gears</text>
<text class="m-t m-s" x="520" y="-150">lift gear</text>
<text class="m-t m-s" x="424" y="-98">walkway +63</text>
<text class="m-t m-s" x="478" y="-400">Mainspring</text><text class="m-t m-s" x="478" y="-376">ramp</text>
<text class="m-t m-s" x="60" y="-336">vent chain</text>
<text class="m-t m-s" x="278" y="-300">bell</text>
