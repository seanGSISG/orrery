<use href="#ascentz2egg" x="125" y="-40"/>
<use href="#ascentz2rest" x="310" y="14"/><use href="#ascentz2rest" x="364" y="-244"/><use href="#ascentz2rest" x="350" y="-514"/>
<!-- labels -->
<text class="m-t m-s" x="150" y="-112">Clock face</text>
<text class="m-t m-s" x="34" y="-40">hands</text>
<text class="m-t m-s" x="76" y="-234">numeral stones</text>
