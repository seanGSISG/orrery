<text class="m-t m-s" x="424" y="622">channel −1</text><text class="m-t m-s m-end" x="164" y="560">+1</text>
<text class="m-t" x="506" y="446">Trapdoor</text><text class="m-t" x="506" y="470">hall</text><text class="m-t m-s" x="506" y="494">0</text>
