<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1262" role="img" aria-labelledby="b02title">
<title id="b02title">B2 Loose Hours: top-down plan</title>
<style>
.m-bg{fill:#0f1218}
