<text class="m-t m-s" x="426" y="322">terrace +1</text>
<text class="m-t m-s m-end" x="114" y="262">+2</text><text class="m-t m-s m-end" x="84" y="204">+3</text><text class="m-t m-s m-end" x="134" y="134">+4</text>
<text class="m-t m-s" x="318" y="252">pillars</text>
<text class="m-t m-s" x="468" y="244">+1 to +4</text>
<text class="m-t" x="378" y="118">Finish deck</text><text class="m-t m-s" x="378" y="142">+5</text>
