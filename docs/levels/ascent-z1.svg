<rect class="m-solid" x="56" y="116" width="10" height="10"/><rect class="m-solid" x="70" y="116" width="10" height="10"/><rect class="m-solid" x="84" y="116" width="10" height="10"/>
<circle cx="108" cy="104" r="10" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
<circle cx="108" cy="58" r="6" fill="#0f1218" stroke="#fff" stroke-width="2.5"/>
<path class="m-r1" d="M104 62L92 108L56 122L34 112L22 84" style="stroke-width:3"/>
<path class="m-r1" d="M114 62L150 104L176 100" style="stroke-width:3;stroke-dasharray:2 6"/>
<text class="m-t m-s" x="128" y="34">Tower</text><text class="m-t m-s" x="60" y="150">A</text><text class="m-t m-s" x="146" y="132">B</text><text class="m-t m-s" x="4" y="166">plan, 62 m wide</text>
</g>
</g>
</g>
<path d="M20 720H700" stroke="#2d3a4f" stroke-width="2"/>
