<rect class="m-box" x="-2" y="-2" width="222" height="176"/>
<rect class="e0 m-edge" x="49" y="49" width="119" height="112"/>
<rect class="m-solid" x="0" y="21" width="38" height="70"/><rect class="m-solid" x="14" y="98" width="35" height="42"/>
<rect class="m-solid" x="168" y="63" width="42" height="63"/>
