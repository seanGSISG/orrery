<path class="m-r1" d="M300-6H250L230-16L195-26L160-36L92-46"/>
<path class="m-r1" d="M86-52V-104L28-146L14-198"/>
<path class="m-r1" d="M60-206L226-278L264-266"/>
<path class="m-r1" d="M280-268L340-312L282-358L340-406L282-456L322-492"/>
<path class="m-r2" d="M22-204L32-222L238-282L262-272"/>
<path class="m-r2" d="M290-282L338-316L314-322V-464L296-470L326-494"/>
