<use href="#ascentz1start" x="318" y="-22"/>
<use href="#ascentz1vent" x="80" y="-56"/><use href="#ascentz1vent" x="10" y="-156"/><use href="#ascentz1vent" x="446" y="-316"/><use href="#ascentz1vent" x="372" y="-416"/>
<use href="#ascentz1bump" x="436" y="-384"/><use href="#ascentz1bump" x="424" y="-484"/>
<use href="#ascentz1egg" x="34" y="-18"/>
<use href="#ascentz1rest" x="124" y="-56"/><use href="#ascentz1rest" x="500" y="-106"/><use href="#ascentz1rest" x="328" y="-246"/><use href="#ascentz1rest" x="398" y="-354"/><use href="#ascentz1rest" x="340" y="-516"/>
<!-- labels -->
<text class="m-t m-s" x="150" y="-70">Bakery +4</text>
<text class="m-t m-s" x="112" y="-120">Guildhall +14</text>
<text class="m-t m-s" x="100" y="-236">hoist</text><text class="m-t m-s" x="96" y="-272">crane beam</text>
<text class="m-t m-s" x="544" y="-134">Workshop</text><text class="m-t m-s" x="544" y="-110">+9</text>
<text class="m-t m-s" x="380" y="-160">planks +14</text>
<text class="m-t m-s" x="380" y="-232">Belfry floor +26</text>
<text class="m-t m-s" x="464" y="-330">outside way</text>
<text class="m-t m-s" x="440" y="-500">Rim +50, to zone 2</text>
<text class="m-t m-s" x="322" y="20">Square 0</text><path class="m-axis" d="M524 14H624M524 6V22M624 6V22"/><text class="m-t m-s m-end" x="516" y="38">10 m</text>
<text class="m-t" x="160" y="20">A</text><text class="m-t" x="440" y="20">B</text>
