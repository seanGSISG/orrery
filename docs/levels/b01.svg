<circle class="m-dish" cx="300" cy="570" r="62"/>
<circle class="m-pillar" cx="205" cy="475" r="8"/><circle class="m-pillar" cx="395" cy="475" r="8"/><circle class="m-pillar" cx="205" cy="665" r="8"/><circle class="m-pillar" cx="395" cy="665" r="8"/>
<!-- west terrace +2 and its ramp -->
<rect class="e2 m-edge" x="20" y="400" width="100" height="210"/>
<rect class="e2 m-edge" x="20" y="610" width="30" height="70"/>
<rect class="e0 m-edge" x="50" y="610" width="80" height="70"/>
<path class="m-chev" d="M112 628L96 645L112 662M88 628L72 645L88 662"/>
<!-- garden -2: south part, east strip, alley; ramp and landing -->
<rect class="e-2 m-edge" x="470" y="580" width="50" height="120"/>
<rect class="e-2 m-edge" x="520" y="380" width="70" height="320"/>
<rect class="e-2" x="518" y="582" width="6" height="116"/>
<rect class="e-2 m-edge" x="398" y="330" width="192" height="50"/>
<rect class="e-2" x="522" y="376" width="66" height="8"/>
