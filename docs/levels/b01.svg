<text class="m-t" x="86" y="1020">First-run route</text>
<g transform="translate(397,1013)"><path class="m-r2" d="M-20 0H16"/></g>
<text class="m-t" x="431" y="1020">Expert route</text>
<g transform="translate(52,1057)"><rect class="e2 m-edge" x="-16" y="-11" width="32" height="22"/><path class="m-chev" d="M-8 5L0-3L8 5"/></g>
<text class="m-t" x="86" y="1064">Ramp, arrows point up</text>
<g transform="translate(397,1057)"><path class="m-beam" d="M-16 6L16-6"/></g>
<text class="m-t" x="431" y="1064">Narrow beam</text>
<g transform="translate(52,1101)"><rect class="m-under" x="-15" y="-11" width="30" height="22"/></g>
