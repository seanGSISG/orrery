<rect class="e2 m-edge" x="240" y="330" width="120" height="110"/>
<path class="m-chev" d="M280 420L300 400L320 420M280 390L300 370L320 390M280 360L300 340L320 360"/>
<!-- plaza 0 with clock inlay and dish -->
<rect class="e0 m-edge" x="130" y="440" width="340" height="260"/>
<!-- hand yard 0 m, under the beam: it catches a fall -->
<rect class="e0 m-edge" x="120" y="330" width="120" height="110"/>
<rect class="e0" x="132" y="432" width="106" height="16"/>
<rect class="e0 m-edge" x="220" y="700" width="160" height="80"/>
<rect class="e0" x="222" y="690" width="156" height="20"/>
