<text class="m-t" x="431" y="932">Finish pad</text>
<g transform="translate(52,969)"><use href="#b01gem"/></g>
<text class="m-t" x="86" y="976">Gem</text>
<g transform="translate(397,969)"><use href="#b01egg"/></g>
<text class="m-t" x="431" y="976">Clockwork Egg</text>
