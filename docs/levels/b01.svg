<rect class="e-2 m-edge" x="470" y="480" width="50" height="100"/>
<path class="m-chev" d="M483 560L495 546L507 560M483 530L495 516L507 530"/>
<path class="m-wall" d="M520 384V578M470 384H516"/>
<!-- vault under the court -->
<rect class="m-under" x="398" y="262" width="72" height="68"/>
<!-- minute hand beam, terrace +2 to court +4 -->
<path class="m-beam" d="M104 402L152 326"/>
<!-- routes -->
<path class="m-case" d="M300 722V585L210 572L134 640H42L62 560L66 444"/>
<path class="m-r1" d="M300 722V585L210 572L134 640H42L62 560L66 444"/>
<path class="m-r1" d="M78 446L82 600L140 660L385 578"/>
<path class="m-r1" d="M398 562L486 462L490 592L498 640"/>
<path class="m-r1" d="M508 646L552 532"/>
<path class="m-r1" d="M546 516L530 592L498 596V470L310 444V336L212 284"/>
<path class="m-r1" d="M204 262L288 180"/>
<path class="m-case" d="M316 730L452 694L498 664"/>
<path class="m-r2" d="M316 730L452 694L498 664"/>
<path class="m-r2" d="M514 640L562 536"/>
<path class="m-r2" d="M566 518L536 600L506 602L502 474L404 584L312 586L214 586L140 652H52L78 560V452L104 402L152 326L196 286"/>
<path class="m-r2" d="M214 268L300 192"/>
<!-- objects -->
<use href="#b01start" x="300" y="745"/>
<use href="#b01finish" x="300" y="165"/>
<use href="#b01gem" x="300" y="570"/><use href="#b01gem" x="200" y="570"/><use href="#b01gem" x="398" y="570"/>
<use href="#b01gem" x="70" y="560"/><use href="#b01gem" x="70" y="436"/>
<use href="#b01gem" x="502" y="656"/><use href="#b01gem" x="556" y="522"/>
<use href="#b01gem" x="202" y="276"/>
<use href="#b01egg" x="434" y="296"/>
<!-- labels and spot heights -->
<text class="m-t m-mid" x="300" y="258">Upper court</text><text class="m-t m-s" x="140" y="246">+4</text><text class="m-t m-s" x="170" y="420">yard 0</text>
<text class="m-t m-mid" x="300" y="505">Plaza</text><text class="m-t m-s" x="150" y="690">0</text>
<text class="m-t m-s m-mid" x="300" y="612">−0.6</text>
<text class="m-t" x="-48" y="388">Terrace</text><text class="m-t m-s" x="28" y="500">+2</text>
<text class="m-t m-end" x="648" y="728">Garden</text><text class="m-t m-s" x="540" y="610">−2</text>
<text class="m-t" x="478" y="290">Vault</text><text class="m-t m-s" x="478" y="314">−2</text>
<text class="m-t" x="-48" y="318">Minute</text><text class="m-t" x="-48" y="342">Hand</text>

<text class="m-t m-s m-end" x="466" y="432">drop 2 m</text>
<!-- scale bar and north -->
<path class="m-axis" d="M0 820H100M0 812V828M100 812V828"/><text class="m-t m-s" x="112" y="827">10 m</text>
<path d="M570 160L580 120L590 160L580 152z" fill="#f4efe4"/><text class="m-t m-s m-mid" x="580" y="184">N</text>
</g>
</g>
<path d="M20 850H700" stroke="#2d3a4f" stroke-width="2"/>
