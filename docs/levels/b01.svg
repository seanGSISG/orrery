<rect class="e4 m-edge" x="384" y="862" width="34" height="28"/>
<text class="m-t m-s" x="424" y="884">+4</text>
<rect class="e6 m-edge" x="460" y="862" width="34" height="28"/>
<text class="m-t m-s" x="500" y="884">+6</text>
<rect class="e8 m-edge" x="536" y="862" width="34" height="28"/>
