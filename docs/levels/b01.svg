<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1178" role="img" aria-labelledby="b01title">
<title id="b01title">B1 Dawn Plaza: top-down plan</title>
<style>
.m-bg{fill:#0f1218}
.m-t{font:600 20px system-ui,'Noto Sans','DejaVu Sans',sans-serif;fill:#f4efe4;paint-order:stroke;stroke:#0f1218;stroke-width:4px;stroke-linejoin:round}
.m-h{font-size:27px;font-weight:700}
.m-s{font-size:18px;fill:#ffe9a8}
.m-n{font:700 17px system-ui,'Noto Sans','DejaVu Sans',sans-serif;fill:#0f1218;text-anchor:middle}
.m-mid{text-anchor:middle}
.m-end{text-anchor:end}
.m-grid{stroke:#ffffff;stroke-opacity:.07;stroke-width:1;fill:none}
.m-axis{stroke:#8f9bb0;stroke-width:2;fill:none}
.m-edge{stroke:#8fa0ba;stroke-opacity:.55;stroke-width:1.5}
.e-2{fill:#1b3152}
.e0{fill:#27466a}
.e2{fill:#2a7183}
.e4{fill:#4c8a62}
.e6{fill:#9a8d3c}
.e8{fill:#c98f2b}
.m-dish{fill:#1f3a5a;stroke:#d8a737;stroke-width:2;stroke-dasharray:3 5}
.m-inlay{fill:none;stroke:#d8a737;stroke-width:2;stroke-opacity:.7}
.m-chev{fill:none;stroke:#f4efe4;stroke-opacity:.6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.m-wall{stroke:#aab4c4;stroke-width:5;stroke-linecap:round;fill:none}
.m-pillar{fill:#0b0d12;stroke:#8f9bb0;stroke-width:2}
.m-beam{stroke:#e9c46a;stroke-width:11;stroke-linecap:round;fill:none}
.m-under{fill:#172a44;fill-opacity:.55;stroke:#ffe9a8;stroke-width:2;stroke-dasharray:6 5}
.m-trap{fill:#6d4a1e;stroke:#ffb347;stroke-width:2.5}
.m-trapx{stroke:#ffb347;stroke-width:2.5;fill:none}
.m-crum{fill:#3b3f52;stroke:#d7dbe8;stroke-width:2.5;stroke-dasharray:5 5}
.m-crack{stroke:#d7dbe8;stroke-width:2;fill:none}
.m-mp{fill:#8b5cf6;stroke:#efe7ff;stroke-width:2.5}
.m-mpp{stroke:#c4b5fd;stroke-width:3;stroke-dasharray:3 7;stroke-linecap:round;fill:none}
.m-gear{fill:#5b6478;stroke:#e9c46a;stroke-width:7;stroke-dasharray:7 6}
.m-pend{stroke:#fb7185;stroke-width:4;stroke-linecap:round;fill:none}
.m-pendarc{stroke:#fb7185;stroke-width:2.5;stroke-dasharray:4 5;fill:none}
.m-bob{fill:#fb7185;stroke:#fff;stroke-width:2}
.m-case{fill:none;stroke:#0f1218;stroke-width:9;stroke-opacity:.6;stroke-linejoin:round;stroke-linecap:round}
.m-r1{fill:none;stroke:#ffffff;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#b01a1)}
.m-r2{fill:none;stroke:#ff5cf4;stroke-width:4;stroke-dasharray:11 8;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#b01a2)}
.m-sil{fill:#1a2230;stroke:#2d3a4f;stroke-width:1.5}
.m-solid{fill:#33415a;stroke:#2d3a4f;stroke-width:1.5}
.m-walk{fill:none;stroke:#e9c46a;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.m-ship{fill:#4a3550;stroke:#7a5b83;stroke-width:1.5}
.m-zone{stroke:#8f9bb0;stroke-width:2;stroke-dasharray:10 8;fill:none}
.m-fall{fill:none;stroke:#8f9bb0;stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round;marker-end:url(#b01a3)}
.m-box{fill:#141925;stroke:#2d3a4f;stroke-width:2}
</style>
<defs>
<marker id="b01a1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffffff"/></marker>
<marker id="b01a2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5cf4"/></marker>
<marker id="b01a3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f9bb0"/></marker>
<g id="b01gem"><path d="M0-12L10 0L0 12L-10 0z" fill="#ff3b5f" stroke="#fff" stroke-width="2.5"/></g>
<g id="b01egg"><circle r="19" fill="none" stroke="#ffd84a" stroke-width="2.5" stroke-dasharray="4 4"/><ellipse rx="9" ry="12" fill="#ffd84a" stroke="#0f1218" stroke-width="2"/><path d="M-8-2H8" stroke="#0f1218" stroke-width="2"/></g>
<g id="b01start"><circle r="15" fill="#0f1218" stroke="#fff" stroke-width="3.5"/><text class="m-n" y="6" style="fill:#fff">S</text></g>
<g id="b01finish"><circle r="15" fill="#fff" stroke="#0f1218" stroke-width="2.5"/><text class="m-n" y="6">F</text></g>
<g id="b01cp"><path d="M-6 13V-14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M-5-14L13-7L-5 0z" fill="#3ee07f" stroke="#fff" stroke-width="2"/></g>
<g id="b01bump"><circle r="11" fill="#ff8a3d" stroke="#fff" stroke-width="2.5"/><circle r="4" fill="#0f1218"/></g>
<g id="b01vent"><circle r="11" fill="#0f1218" stroke="#7dd3fc" stroke-width="3"/><path d="M-5 2L0-4L5 2M-5 7L0 1L5 7" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="b01spring"><circle r="12" fill="#b6f03c" stroke="#0f1218" stroke-width="2"/><path d="M-6 6L6 3L-6-1L6-4L-2-8" fill="none" stroke="#0f1218" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="b01rest"><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#0f1218" stroke="#3ee07f" stroke-width="2.5"/><path d="M-5 0H5" stroke="#3ee07f" stroke-width="3" stroke-linecap="round"/></g>
<g id="b01gate"><path d="M-12 14V-6A12 12 0 0 1 12-6V14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M-5 14V-4M5 14V-4M0 14V-8" stroke="#fff" stroke-width="2"/></g>
</defs>
<rect class="m-bg" width="720" height="1178"/>
<text class="m-t m-h" x="30" y="44">B1 Dawn Plaza</text>
<text class="m-t m-s m-end" x="690" y="44">plan, north up</text>
<g transform="translate(0,70)">
<g transform="translate(60,-70)">
<path class="m-grid" d="M0 100V800M100 100V800M200 100V800M300 100V800M400 100V800M500 100V800M600 100V800M0 100H600M0 200H600M0 300H600M0 400H600M0 500H600M0 600H600M0 700H600M0 800H600"/>
<!-- 10 px = 1 m. x east, y south. Heights in the class name: e0 = 0 m, e2 = +2 m, e4 = +4 m, e-2 = -2 m -->
<!-- upper court +4 and finish dais -->
<circle class="e4 m-edge" cx="300" cy="170" r="56"/>
<rect class="e4 m-edge" x="130" y="220" width="340" height="110"/>
<rect class="e4" x="250" y="205" width="100" height="30"/>
