<text class="m-t m-s" x="476" y="-372">mast</text>
<text class="m-t m-s m-mid" x="410" y="-575">Flagship</text>
<text class="m-t m-s" x="310" y="-398">deck +144</text>
<text class="m-t m-s" x="212" y="-640">top +162</text>
<text class="m-t m-s" x="592" y="-452">fin</text>
<text class="m-t m-s m-end" x="388" y="-708">Gate +170</text>
<text class="m-t" x="150" y="24">A</text><text class="m-t" x="590" y="24">B</text>
<path class="m-axis" d="M0 54H100M0 46V62M100 46V62"/><text class="m-t m-s" x="112" y="61">10 m</text>
</g>
