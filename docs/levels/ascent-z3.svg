<path class="m-r1" d="M92-94L90-156L116-168L144-178L172-188"/>
<path class="m-r1" d="M200-192L240-228"/>
<path class="m-r1" d="M236-238L203-248L173-258L148-266L50-312L146-360L102-402"/>
<path class="m-r1" d="M190-398L292-444"/>
<path class="m-r1" d="M322-446L496-494L342-538"/>
<path class="m-r1" d="M344-550V-626H426L462-660L428-694"/>
<path class="m-r2" d="M104-160L246-228"/>
<path class="m-r2" d="M262-230H332L348-290L384-294L433-304L469-314L520-324L582-328"/>
<path class="m-r2" d="M594-336L590-402L540-414L510-426L538-438L522-446"/>
<path class="m-r2" d="M530-452L610-500L540-548"/><path class="m-r2" d="M546-566L536-606L448-634L478-664L436-702"/>
