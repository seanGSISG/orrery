<!-- routes -->
<path class="m-case" d="M278-8L249-18L215-28L188-38L112-88H94L90-156L116-168L144-178L172-188L200-190L240-228L233-238L203-248L173-258L148-266L50-312L146-360L100-404L180-394L296-446L322-446L496-494L338-540L344-628L430-628L466-660L426-698"/>
