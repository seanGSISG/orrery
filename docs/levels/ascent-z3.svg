<text class="m-t m-s" x="30" y="884">Plan, 62 m wide.</text><text class="m-t m-s" x="30" y="910">Gold box: the</text><text class="m-t m-s" x="30" y="934">Harbourmaster</text><text class="m-t m-s" x="30" y="958">roof.</text>
<text class="m-t m-s" x="484" y="884">Top ship: the</text><text class="m-t m-s" x="484" y="910">Flagship.</text>
</g>
<path d="M20 1080H700" stroke="#2d3a4f" stroke-width="2"/>
