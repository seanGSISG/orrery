<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1448" role="img" aria-labelledby="ascentz3title">
<title id="ascentz3title">Ascent 3 Sky Harbour: side elevation with top-down inset</title>
<style>
.m-bg{fill:#0f1218}
