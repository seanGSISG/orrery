<use href="#ascentz3gate" x="424" y="-716"/>
<!-- labels -->
<text class="m-t m-s" x="96" y="-36">Roof 1</text><text class="m-t m-s" x="0" y="-184">Roof 2</text>
<text class="m-t m-s" x="122" y="-212">rope</text>
<text class="m-t m-s" x="252" y="-176">Harbourmaster +122</text>
<text class="m-t m-s m-mid" x="490" y="-70">Tender</text>
