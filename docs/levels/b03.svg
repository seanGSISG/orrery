<text class="m-t m-s" x="352" y="76">ledge +3</text>
<text class="m-t m-s" x="352" y="132">N dock</text><text class="m-t m-s" x="318" y="312">S dock</text>
<text class="m-t m-s" x="528" y="598">+1</text><text class="m-t m-s" x="528" y="362">+6</text><text class="m-t m-s" x="528" y="480">gears</text>
<text class="m-t m-s" x="-50" y="800">Carriages stop 2 s at W, N, E and S. Loop 21 s.</text>
