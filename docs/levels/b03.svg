<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1282" role="img" aria-labelledby="b03title">
<title id="b03title">B3 Spring Court: top-down plan</title>
<style>
.m-bg{fill:#0f1218}
.m-t{font:600 20px system-ui,'Noto Sans','DejaVu Sans',sans-serif;fill:#f4efe4;paint-order:stroke;stroke:#0f1218;stroke-width:4px;stroke-linejoin:round}
.m-h{font-size:27px;font-weight:700}
.m-s{font-size:18px;fill:#ffe9a8}
.m-n{font:700 17px system-ui,'Noto Sans','DejaVu Sans',sans-serif;fill:#0f1218;text-anchor:middle}
.m-mid{text-anchor:middle}
.m-end{text-anchor:end}
.m-grid{stroke:#ffffff;stroke-opacity:.07;stroke-width:1;fill:none}
