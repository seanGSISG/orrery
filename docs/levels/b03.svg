<text class="m-t" x="408" y="748">Start court</text><text class="m-t m-s" x="408" y="772">0</text>
<text class="m-t" x="160" y="648">The Step</text><text class="m-t m-s" x="160" y="672">+5</text>
<text class="m-t" x="92" y="606">Bumper court</text><text class="m-t m-s" x="92" y="358">0</text>
<text class="m-t m-s" x="168" y="352">sky gem +8.5</text>
<text class="m-t" x="-50" y="220">West balcony</text><text class="m-t m-s" x="48" y="322">+6</text>
<text class="m-t m-end" x="650" y="220">East balcony</text><text class="m-t m-s m-end" x="554" y="322">+6</text>
