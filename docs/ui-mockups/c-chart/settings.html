<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C · Settings</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="frame">
<div class="backdrop dusk" style="--bd-blur:22px;--bd-dim:.4"></div>
<div class="night"></div>
<div class="safe">
  <h1 class="heading name">Settings</h1>
  <ul class="scale caps">
    <li><i class="g g-lb">LB</i></li>
    <li class="tab">Graphics</li>
    <li class="tab on">Display</li>
    <li class="tab">Audio</li>
    <li class="tab">Controls</li>
    <li class="tab">Accessibility</li>
    <li><i class="g g-rb">RB</i></li>
  </ul>
  <div class="rows">
    <div class="row"><span class="name">Mode</span><div class="opts caps"><span>Windowed</span><span>Borderless</span><span class="on">Fullscreen</span></div></div>
    <div class="row focus"><span class="name">Resolution</span><div class="step"><i></i>1920 × 1080<i></i></div></div>
    <div class="row"><span class="name">Frame cap</span><div class="ruler"><div class="line"><i style="left:54%"></i></div><b>144</b></div></div>
    <div class="row"><span class="name">V-Sync</span><div class="switch on caps">On<i></i></div></div>
    <div class="row"><span class="name">HDR</span><div class="switch caps">Off<i></i></div></div>
  </div>
  <p class="hints"><span><i class="g">B</i>Back</span><span><i class="g">Y</i>Defaults</span></p>
</div>
</div>
</body>
</html>
