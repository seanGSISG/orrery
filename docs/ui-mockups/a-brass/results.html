<!doctype html>
<html lang="en">
<head>

<title>A · Results</title>
<link rel="stylesheet" href="../shared/base.css">

</head>
<body>
<div class="frame">
<div class="backdrop noon" style="--bd-blur:16px;--bd-dim:.5"></div>

    <p class="where">8 · Gear Bridge</p>
    <p class="time cast">0:46.82</p>

      <li><i class="i i-egg"></i>Egg<b>Found</b><i class="i i-check"></i></li>

    </ul>
    <p class="actions caps">
      <span class="plate focus"><i class="g">A</i>Next</span>
      <span class="plate"><i class="g g-view"></i>Retry</span>
      <span class="plate"><i class="g">B</i>Levels</span>

</div>
</div>
