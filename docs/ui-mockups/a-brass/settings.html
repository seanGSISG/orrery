<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A · Settings</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="frame">
<div class="backdrop dusk" style="--bd-blur:22px;--bd-dim:.55"></div>
<div class="safe">
  <div class="board plate big">
    <div class="tabs caps">
      <i class="g g-lb">LB</i>
      <span class="plate">Graphics</span>
      <span class="plate on">Display</span>
      <span class="plate">Audio</span>
      <span class="plate">Controls</span>
      <span class="plate">Accessibility</span>
      <i class="g g-rb">RB</i>
    </div>
    <div class="rows">
      <div class="row"><span class="caps">Mode</span><div class="seg caps"><span class="plate">Windowed</span><span class="plate">Borderless</span><span class="plate on"><i class="i i-check"></i>Fullscreen</span></div></div>
      <div class="row focus"><span class="caps">Resolution</span><div class="step"><i></i>1920 × 1080<i></i></div></div>
      <div class="row"><span class="caps">Frame cap</span><div class="slide"><div class="groove"><i style="width:54%"></i></div><b>144</b></div></div>
      <div class="row"><span class="caps">V-Sync</span><div class="lever on">On<i></i></div></div>
      <div class="row"><span class="caps">HDR</span><div class="lever">Off<i></i></div></div>
    </div>
    <p class="hints"><span><i class="g">B</i>Back</span><span><i class="g">Y</i>Defaults</span></p>
  </div>
</div>
</div>
</body>
</html>
