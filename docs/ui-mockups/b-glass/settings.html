<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Settings</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="frame">
<div class="backdrop dusk" style="--bd-blur:22px;--bd-dim:.62"></div>
<div class="safe">
  <div class="panel glass">
    <nav>
      <h1>Settings</h1>
      <ul class="tabs"><li>Graphics</li><li class="on">Display</li><li>Audio</li><li>Controls</li><li>Accessibility</li></ul>
      <p class="bumpers"><i class="g g-lb">LB</i><i class="g g-rb">RB</i></p>
    </nav>
    <div class="rows">
      <div class="row"><span>Mode</span><div class="seg"><span>Windowed</span><span>Borderless</span><span class="on"><i class="i i-check"></i>Fullscreen</span></div></div>
      <div class="row focus"><span>Resolution</span><div class="step"><i>‹</i>1920 × 1080<i>›</i></div></div>
      <div class="row"><span>Frame cap</span><div class="slide"><div class="line"><i style="width:54%"></i></div><b>144</b></div></div>
      <div class="row"><span>V-Sync</span><div class="switch on">On<i></i></div></div>
      <div class="row"><span>HDR</span><div class="switch">Off<i></i></div></div>
      <p class="hints"><span><i class="g">B</i>Back</span><span><i class="g">Y</i>Defaults</span></p>
    </div>
  </div>
</div>
</div>
</body>
</html>
