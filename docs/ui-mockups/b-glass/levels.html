<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Level select</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="frame">
<div class="backdrop dawn" style="--bd-blur:18px;--bd-dim:.62"></div>
<div class="safe">
  <div class="tiers glass">
    <i class="g g-lb">LB</i>
    <b>Beginner</b>
    <span><i class="i i-lock"></i>Intermediate</span>
    <span><i class="i i-lock"></i>Advanced</span>
    <i class="g g-rb">RB</i>
  </div>
  <p class="totals"><span><i class="i i-gold"></i>4/20</span><span><i class="i i-egg"></i>5/20</span></p>
  <ol class="cards">
    <li class="card glass">
      <div class="thumb" style="background-image:url(../backdrops/dawn-b.jpg);background-size:230%;background-position:30% 60%"></div>
      <div class="body"><span class="no">5</span><span class="name">Pendulum Walk</span><span class="time">1:12.36</span><span class="marks"><i class="i i-par"></i><i class="i i-egg off"></i></span></div>
    </li>
    <li class="card glass">
      <div class="thumb" style="background-image:url(../backdrops/dawn.jpg);background-size:200%;background-position:95% 30%"></div>
      <div class="body"><span class="no">6</span><span class="name">Quarter Chime</span><span class="time">1:21.40</span><span class="marks"><i class="i i-par"></i><i class="i i-egg off"></i></span></div>
    </li>
    <li class="card glass">
      <div class="thumb" style="background-image:url(../backdrops/dawn-b.jpg);background-size:170%;background-position:85% 45%"></div>
      <div class="body"><span class="no">7</span><span class="name">Brass Gardens</span><span class="time">0:58.91</span><span class="marks"><i class="i i-par"></i><i class="i i-egg"></i></span></div>
    </li>
    <li class="card glass focus">
      <div class="thumb" style="background-image:url(../backdrops/dawn.jpg);background-size:150%;background-position:40% 35%"></div>
      <div class="body"><span class="no">8</span><span class="name">Gear Bridge</span><span class="time">0:46.82</span>
        <span class="targets"><span><i class="i i-star"></i>0:48.00</span><span><i class="i i-check"></i>1:10.00</span></span>
        <span class="marks"><i class="i i-gold"></i><i class="i i-egg"></i></span></div>
    </li>
    <li class="card glass new">
      <div class="thumb" style="background-image:url(../backdrops/dawn-b.jpg);background-size:140%;background-position:10% 20%"></div>
      <div class="body"><span class="no">9</span><span class="name">Cloud Gate</span><span class="time">–:––.––</span><span class="marks"><i class="i i-medal-none"></i><i class="i i-egg off"></i></span></div>
    </li>
    <li class="card glass locked"><i class="i i-lock"></i><span class="no">10</span></li>
    <li class="card glass locked"><i class="i i-lock"></i><span class="no">11</span></li>
  </ol>
  <!-- One mark per level: star = gold, dot = par, ring = open, faint dot = locked. -->
  <ol class="dots">
    <li class="gold"></li><li class="gold"></li><li class="done"></li><li class="gold"></li><li class="done"></li><li class="done"></li><li class="done"></li><li class="gold here"></li><li class="new"></li>
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
  </ol>
  <p class="hints"><span><i class="g">A</i>Play</span><span><i class="g">B</i>Back</span></p>
</div>
</div>
</body>
</html>
