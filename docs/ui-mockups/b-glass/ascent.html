<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B · Ascent HUD</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="frame">
<div class="backdrop dawn"></div>
<div class="safe">
  <div class="stats">
    <div class="glass"><span>Falls</span><b>7</b></div>
    <div class="glass time">14:32</div>
  </div>
  <!-- The rail is the whole climb, 0 to 600 m. Short bars mark the zone starts. -->
  <div class="rail">
    <i class="track"></i><i class="climbed" style="height:14.33%"></i>
    <i class="zone" style="bottom:8.33%"></i><i class="zone" style="bottom:16.67%"></i><i class="zone" style="bottom:28.33%"></i><i class="zone" style="bottom:41.67%"></i><i class="zone" style="bottom:56.67%"></i><i class="zone" style="bottom:71.67%"></i><i class="zone" style="bottom:86.67%"></i>
    <i class="top"></i>
    <div class="best glass" style="bottom:23.83%"><i class="i i-flag"></i>143</div>
    <div class="now glass" style="bottom:14.33%"><b>86</b><span>m</span></div>
  </div>
</div>
</div>
</body>
</html>
