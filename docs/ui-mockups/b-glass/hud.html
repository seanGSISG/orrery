<!doctype html>
<html lang="en" id="keys">
<head>
<meta charset="utf-8">
<title>B · In-level HUD</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="frame">
<div class="backdrop noon or-build"></div>
<div class="safe">
  <div class="gems glass"><i class="i i-gem"></i><b>3</b><span>/5</span></div>
  <div class="timer glass">
    <div class="readout"><b>0:42</b><span>.37</span></div>
    <div class="target"><i class="i i-star"></i>0:48</div>
    <div class="bar"><i class="fill" style="width:60.5%"></i><i class="gold" style="left:68.6%"></i><i class="par"></i></div>
  </div>
  <div class="toast glass pad-only"><i class="i i-check"></i>Checkpoint</div>
  <div class="toast glass keys-only"><i class="g g-key">Space</i>Jump</div>
  <div class="slot glass"><i class="i i-spring"></i><i class="g pad-only">X</i><i class="g g-mouse keys-only"></i></div>
</div>
</div>
</body>
</html>
